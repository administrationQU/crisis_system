{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/about.css' %}">

<div class="about-container">
    {% if about %}
    <div class="about-header">
        <div class="logos">
            <img src="{{ about.university_logo.url }}" alt="University Logo">
            <img src="{{ about.college_logo.url }}" alt="Faculty Logo">
        </div>
        <h1>ABOUT <span>THE PROJECT</span></h1>
    </div>

    <div class="about-desc">
        <p>{{ about.description }}</p>
    </div>

    <div class="goals-section">
        <h3>أهداف المشروع</h3>
        <div class="goals-grid">
            {% for goal in about.goals.all %}
            <div class="goal-item">
                <img src="{{ goal.icon.url }}" alt="{{ goal.title }}">
                <h4>{{ goal.title }}</h4>
                <p>{{ goal.description }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
