{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency System</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <!-- Links -->
            <div class="nav-links">
                <a href="/" class="nav-logo">🏠 الرئيسية</a>
                <a href="/about/" class="about-link">ℹ️ حول المشروع</a>
            </div>

            <!-- Search -->
            <form action="/search/" method="GET" class="search-form">
                <input type="text" name="q" placeholder="بحث عن حالة طوارئ...">
                <button type="submit">بحث</button>
            </form>

        </div>

    </nav>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
